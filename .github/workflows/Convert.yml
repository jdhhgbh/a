name: Convert Video from URL to MP4

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'رابط الفيديو المباشر (Direct Video URL)'
        required: true
        type: string

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg & yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Download and Convert Losslessly
        run: |
          mkdir -p output_videos
          cd output_videos
          
          # تنزيل الفيديو وتغيير الحاوية إلى MP4 دون تقليل الجودة
          yt-dlp "${{ github.event.inputs.video_url }}" \
            --recode-video mp4 \
            --postprocessor-args "ffmpeg:-c copy" \
            -o "converted_video.%(ext)s"

      - name: Upload Converted Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: converted-mp4-video
          path: output_videos/
