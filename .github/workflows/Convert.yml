name: Video Stabilization Workflow

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'رابط مباشر للفيديو المراد تعديله'
        required: true

jobs:
  stabilize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg with vidstab
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download Video
        run: |
          curl -L "${{ github.event.inputs.video_url }}" -o input.mp4

      - name: Pass 1 - Analyze Shaking
        run: |
          ffmpeg -i input.mp4 -vf vidstabdetect=stepsize=6:shakiness=8:accuracy=15:result=transforms.trf -f null -

      - name: Pass 2 - Stabilize Video
        run: |
          ffmpeg -i input.mp4 -vf vidstabtransform=smoothing=30:input=transforms.trf -c:a copy output.mp4

      - name: Upload Stabilized Video
        uses: actions/upload-artifact@v4
        with:
          name: stabilized-video
          path: output.mp4
