name: Daily IPTV Trial Automator

on:
  schedule:
    # يشتغل تلقائياً كل يوم الساعة 5:00 صباحاً بتوقيت جرينتش (8:00 صباحاً بتوقيت مكة)
    - cron: '0 5 * * *'
  workflow_dispatch: # يتيح لك تشغيله يدوياً بأي وقت

jobs:
  register_trial:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Automation Script
      run: python script.py
